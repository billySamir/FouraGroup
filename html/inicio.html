<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foura Group | Suministros Industriales</title>
    
    <!-- Scripts y Fuentes Externas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <!-- Hoja de Estilos - RUTA CORREGIDA PARA GITHUB -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-[#0a0a0a] text-white">

    <header class="fixed w-full z-[100] bg-[#0a0a0a]/90 backdrop-blur-md border-b border-white/10">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3 cursor-pointer" onclick="navigateTo('home')">
                <!-- LOGO - RUTA CORREGIDA -->
                <img src="../img/logo.png" alt="Foura Group Logo" class="h-10 w-auto object-contain" onerror="this.src='https://placehold.co/200x50/111/fff?text=Foura+Group'">
                <span class="text-xl font-black tracking-tighter uppercase">Foura <span class="text-blue-600">Group E.I.R.L</span></span>
            </div>
            
            <nav class="hidden md:flex space-x-8 text-[10px] font-bold uppercase tracking-[0.2em]">
                <a href="javascript:void(0)" onclick="navigateTo('home')" class="hover:text-blue-500 transition-colors">Inicio</a>
                <a href="javascript:void(0)" onclick="navigateTo('catalog')" class="hover:text-blue-500 transition-colors">Productos</a>
            </nav>

            <button onclick="toggleCart()" class="relative p-3 bg-white/5 rounded-xl border border-white/10 group">
                <i class="fa-solid fa-cart-shopping group-hover:scale-110 transition-transform"></i>
                <span id="cart-count" class="absolute -top-2 -right-2 bg-blue-600 text-[10px] w-6 h-6 rounded-full flex items-center justify-center font-bold border-2 border-[#0a0a0a]">0</span>
            </button>
        </div>
    </header>

    <!-- VISTA 1: HOME -->
    <main id="view-home" class="page-view">
        <section class="relative min-h-[70vh] flex items-center pt-32 pb-20 overflow-hidden">
            <div class="container mx-auto px-6 relative z-10 text-center">
                <h1 class="text-6xl md:text-8xl font-black mb-6 leading-[0.9] tracking-tighter uppercase">
                    FOURA <span class="text-blue-600">GROUP</span>
                </h1>
                <p class="text-gray-400 text-lg md:text-xl mb-10 max-w-2xl mx-auto leading-relaxed">
                    Especialistas en <span class="text-white font-semibold">Automatización y Suministros Industriales</span> de alta precisión.
                </p>
                <button onclick="navigateTo('catalog')" class="bg-blue-600 hover:bg-blue-700 px-10 py-4 rounded-full font-black uppercase tracking-widest transition-all shadow-lg shadow-blue-600/20">
                    Ver Todos los Productos
                </button>
            </div>
        </section>

        <section id="destacados" class="py-24 bg-[#0f0f0f] border-y border-white/5">
            <div class="container mx-auto px-6">
                <div class="flex justify-between items-center mb-12">
                    <h2 class="text-3xl font-black uppercase tracking-tighter">Equipos Destacados</h2>
                    <div class="flex gap-2">
                        <button onclick="slidePrev()" class="w-10 h-10 rounded-full border border-white/10 flex items-center justify-center hover:bg-blue-600"><i class="fa-solid fa-chevron-left"></i></button>
                        <button onclick="slideNext()" class="w-10 h-10 rounded-full border border-white/10 flex items-center justify-center hover:bg-blue-600"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                </div>
                <div class="overflow-hidden">
                    <div id="destacados-slider" class="flex gap-6 transition-transform duration-500">
                        <!-- JS Dinámico -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- VISTA 2: CATÁLOGO -->
    <main id="view-catalog" class="page-view hidden transition-opacity duration-300 min-h-screen pt-32 pb-20">
        <div class="container mx-auto px-6">
            <div class="flex flex-col md:flex-row justify-between items-end mb-12 gap-6">
                <div>
                    <h2 class="text-5xl font-black uppercase tracking-tighter">Nuestros <span class="text-blue-600">Productos</span></h2>
                    <p class="text-gray-500 mt-2">Inventario técnico especializado.</p>
                </div>
                <input type="text" id="catalog-search" placeholder="Buscar SKU o nombre..." 
                       class="bg-white/5 border border-white/10 rounded-xl py-3 px-6 w-full md:w-80">
            </div>
            <div id="full-catalog-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                <!-- JS Dinámico -->
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-[#050505] py-12 border-t border-white/5 text-center">
        <p class="text-gray-600 text-[10px] uppercase tracking-[0.4em]">© 2024 FOURA GROUP E.I.R.L - Ingeniería Industrial</p>
    </footer>

    <!-- CARRITO -->
    <div id="cart-drawer" class="fixed inset-0 z-[200] hidden">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="toggleCart()"></div>
        <div class="absolute right-0 top-0 h-full w-full max-w-md bg-[#0f0f0f] p-8 border-l border-white/10 flex flex-col">
            <h2 class="text-2xl font-black mb-8">MI COTIZACIÓN</h2>
            <div id="cart-items" class="flex-grow space-y-4 overflow-y-auto"></div>
            <button onclick="sendToWhatsApp()" class="w-full bg-green-600 py-4 rounded-xl font-bold mt-6">
                <i class="fa-brands fa-whatsapp mr-2"></i> Enviar a WhatsApp
            </button>
        </div>
    </div>

    <!-- SCRIPT - RUTA CORREGIDA -->
    <script src="./js/script.js"></script>
</body>
</html>
