<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración | Foura Group</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-[#050505] text-white min-h-screen">

    <div class="container mx-auto px-6 py-12">
        <div class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-3xl font-black uppercase tracking-tighter">Panel de <span class="text-blue-600">Control</span></h1>
                <p class="text-gray-500 text-sm">Gestiona el inventario de Foura Group E.I.R.L</p>
            </div>
            <a href="../html/inicio.html" class="bg-white/5 border border-white/10 px-6 py-3 rounded-xl text-xs font-bold uppercase hover:bg-blue-600 transition-all">Volver a la Tienda</a>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <form id="product-form" onsubmit="saveProduct(event)" class="bg-[#111111] p-8 rounded-2xl border border-white/5 h-fit lg:col-span-1">
                <h2 id="form-title" class="text-lg font-black mb-6 uppercase tracking-wider text-blue-500">Nuevo Producto</h2>
                
                <input type="hidden" id="edit-product-id">

                <div class="space-y-4">
                    <input type="text" id="prod-name" placeholder="Nombre" required class="w-full bg-[#1a1a1a] p-3 rounded-lg border border-white/10 text-sm outline-none focus:border-blue-500 transition-colors">
                    <input type="text" id="prod-sku" placeholder="SKU" required class="w-full bg-[#1a1a1a] p-3 rounded-lg border border-white/10 text-sm outline-none focus:border-blue-500 transition-colors">
                    <select id="prod-cat" required class="w-full bg-[#1a1a1a] p-3 rounded-lg border border-white/10 text-sm outline-none focus:border-blue-500 text-gray-300">
                        <option value="">Selecciona Categoría...</option>
                        <option value="mecanica">Mecánica</option>
                        <option value="electricidad">Electricidad</option>
                        <option value="herramientas">Herramientas</option>
                    </select>
                    
                    <div class="border-2 border-dashed border-white/10 hover:border-blue-500 p-4 rounded-lg text-center transition-colors">
                        <input type="file" id="prod-img-input" accept="image/*" class="hidden" onchange="previewImage(event)">
                        <button type="button" onclick="document.getElementById('prod-img-input').click()" class="text-[10px] font-bold uppercase text-gray-400 hover:text-blue-500 transition-colors">
                            <i class="fa-solid fa-cloud-arrow-up mr-2 text-lg"></i> Subir Imagen
                        </button>
                        <img id="prod-img-preview" src="#" alt="Preview" class="hidden mt-4 h-24 w-24 object-cover mx-auto rounded border border-white/10">
                    </div>
                    
                    <textarea id="prod-desc" placeholder="Descripción Corta" required class="w-full bg-[#1a1a1a] p-3 rounded-lg border border-white/10 text-sm h-20 outline-none focus:border-blue-500 transition-colors"></textarea>
                    <textarea id="prod-detalles" placeholder="Descripción Larga" class="w-full bg-[#1a1a1a] p-3 rounded-lg border border-white/10 text-sm h-20 outline-none focus:border-blue-500 transition-colors"></textarea>
                    <input type="text" id="prod-variantes" placeholder="Variantes (ej: 40mm:R-40, 50mm:R-50)" class="w-full bg-[#1a1a1a] p-3 rounded-lg border border-white/10 text-sm outline-none focus:border-blue-500 transition-colors">
                    
                    <div class="flex flex-col gap-2 pt-2">
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 py-4 rounded-lg font-black text-xs uppercase tracking-widest transition-all">Guardar Producto</button>
                        <button type="button" id="btn-cancel" onclick="resetForm()" class="w-full bg-gray-800 hover:bg-gray-700 py-3 rounded-lg font-bold text-xs uppercase tracking-widest transition-all hidden text-gray-400">Cancelar Edición</button>
                    </div>
                </div>
            </form>

            <div class="lg:col-span-2 bg-[#0a0a0a] rounded-2xl border border-white/5 overflow-hidden flex flex-col">
                
                <div class="p-5 border-b border-white/5 flex flex-col md:flex-row gap-4 justify-between items-center bg-[#111111]">
                    <div class="w-full flex flex-col md:flex-row gap-3">
                        <div class="relative flex-grow">
                            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 text-sm"></i>
                            <input type="text" id="admin-search" placeholder="Buscar por nombre o SKU..." class="w-full bg-black text-sm py-3 pl-10 pr-4 rounded-xl border border-white/10 focus:border-blue-500 outline-none transition-all text-white placeholder-gray-600">
                        </div>
                        <select id="admin-filter" class="w-full md:w-48 bg-black text-sm p-3 rounded-xl border border-white/10 text-gray-400 focus:border-blue-500 outline-none cursor-pointer">
                            <option value="all">Todas las Categorías</option>
                            <option value="mecanica">Mecánica</option>
                            <option value="electricidad">Electricidad</option>
                            <option value="herramientas">Herramientas</option>
                        </select>
                    </div>
                </div>

                <div class="bg-[#0f0f0f] border-b border-white/5 p-4 flex justify-between items-center">
                    <h3 class="text-xs font-bold text-gray-300 uppercase tracking-[0.1em]">Inventario Actual</h3>
                    <span id="item-count" class="text-[10px] text-gray-400 font-mono bg-black px-3 py-1.5 rounded-md border border-white/5 font-bold tracking-widest">0 Items</span>
                </div>

                <div class="overflow-x-auto flex-grow bg-[#0a0a0a]">
                    <table class="w-full text-left min-w-[600px]">
                        <thead>
                            <tr class="text-[10px] text-gray-500 uppercase tracking-[0.2em] border-b border-white/5 bg-[#0a0a0a]">
                                <th class="p-4 font-bold w-20 text-center">Img</th>
                                <th class="p-4 font-bold">Producto & SKU</th>
                                <th class="p-4 font-bold text-center">Categoría</th>
                                <th class="p-4 font-bold text-center w-32">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="admin-product-list" class="divide-y divide-white/5">
                            </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <div id="delete-modal" class="fixed inset-0 z-[999] hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-black/80 backdrop-blur-sm" onclick="cancelDelete()"></div>
        
        <div class="bg-[#111111] border border-white/10 w-full max-w-sm rounded-[24px] p-8 relative z-10 shadow-2xl text-center transform transition-all duration-300 scale-95 opacity-0" id="delete-modal-content">
            
            <div class="w-20 h-20 bg-red-500/10 rounded-full flex items-center justify-center mx-auto mb-6 border border-red-500/20">
                <i class="fa-solid fa-triangle-exclamation text-red-500 text-4xl"></i>
            </div>
            
            <h3 class="text-2xl font-black text-white uppercase tracking-tighter mb-2">¿Eliminar Producto?</h3>
            <p class="text-sm text-gray-400 mb-8 leading-relaxed">Esta acción es permanente y no se puede deshacer. El producto desaparecerá de la tienda.</p>
            
            <div class="flex gap-4">
                <button onclick="cancelDelete()" class="w-full bg-white/5 hover:bg-white/10 text-white font-bold py-4 rounded-xl transition-all text-xs uppercase tracking-widest border border-white/5">Cancelar</button>
                <button onclick="confirmDelete()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-xl transition-all shadow-[0_0_20px_rgba(220,38,38,0.3)] text-xs uppercase tracking-widest">Eliminar</button>
            </div>
        </div>
    </div>

<script type="module" src="../js/admin.js"></script>
</body>
</html>
